apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-logs-auth-gateway
  namespace: logging
data:
  default.conf: |
    server {
      listen 8080;
      server_name logs.rdrx.app;

      location = /internal/health {
        access_log off;
        return 200 "ok\n";
      }

      location = /internal/authelia/authz {
        internal;
        proxy_pass http://authelia.authelia.svc.cluster.local/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
      }

      location / {
        auth_request /internal/authelia/authz;
        auth_request_set $redirection_url $upstream_http_location;
        auth_request_set $set_cookie $upstream_http_set_cookie;
        auth_request_set $user $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        error_page 401 =302 $redirection_url;
        add_header Set-Cookie $set_cookie always;

        proxy_set_header Host $host;
        proxy_set_header X-Original-URL https://$host$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-URI $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Groups $groups;
        proxy_http_version 1.1;
        proxy_read_timeout 360s;
        proxy_pass http://victoria-logs-vls-server:9428;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs-auth-gateway
  namespace: logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-auth-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs-auth-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.1-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /internal/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: victoria-logs-auth-gateway
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs-auth-gateway
  namespace: logging
spec:
  selector:
    app.kubernetes.io/name: victoria-logs-auth-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoria-logs
  namespace: logging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    haproxy.org/ssl-redirect-port: "443"
spec:
  ingressClassName: haproxy
  rules:
    - host: logs.rdrx.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: victoria-logs-auth-gateway
                port:
                  name: http
  tls:
    - hosts:
        - logs.rdrx.app
      secretName: logs-rdrx-app-tls
