{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "attune-site requires replicaCount=1 because SQLite supports one pod writer" }}
{{- end }}
{{- if not .Values.persistence.enabled }}
{{- fail "attune-site requires persistence.enabled=true for campaign data" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attune-site.fullname" . }}
  labels:
    {{- include "attune-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "attune-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "attune-site.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: SITE_ORIGIN
              value: {{ .Values.siteOrigin | quote }}
            - name: TRUST_PROXY_HEADERS
              value: {{ .Values.trustProxyHeaders | quote }}
            - name: CAMPAIGN_DB_PATH
              value: {{ printf "%s/campaigns.db" .Values.persistence.mountPath | quote }}
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune-site.smtpSecretName" . }}
                  key: host
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune-site.smtpSecretName" . }}
                  key: from
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune-site.smtpSecretName" . }}
                  key: username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune-site.smtpSecretName" . }}
                  key: password
                  optional: true
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_TLS_MODE
              value: {{ .Values.smtp.tlsMode | quote }}
            - name: INQUIRY_TO
              value: {{ .Values.smtp.recipient | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: campaign-data
              mountPath: {{ .Values.persistence.mountPath | quote }}
      volumes:
        - name: campaign-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-campaign-data" (include "attune-site.fullname" .)) .Values.persistence.existingClaim }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
