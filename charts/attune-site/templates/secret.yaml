{{- if not .Values.smtp.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attune-site.smtpSecretName" . }}
  labels:
    {{- include "attune-site.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ required "smtp.host is required when smtp.existingSecret is empty" .Values.smtp.host | quote }}
  from: {{ required "smtp.from is required when smtp.existingSecret is empty" .Values.smtp.from | quote }}
  {{- with .Values.smtp.username }}
  username: {{ . | quote }}
  {{- end }}
  {{- with .Values.smtp.password }}
  password: {{ . | quote }}
  {{- end }}
{{- end }}
