{{- $groups := list (dict "items" (.Values.actionWorkers | default list) "prefix" "action-worker" "role" "worker" "binary" "attune-agent") (dict "items" (.Values.sensorWorkers | default list) "prefix" "sensor-worker" "role" "sensor" "binary" "attune-sensor-agent") -}}
{{- $slots := add (len (.Values.actionWorkers | default list)) (len (.Values.sensorWorkers | default list)) -}}
{{- if gt (int $slots) 0 -}}
{{- if not .Values.workloadSecurity.enabled }}{{ fail "execution-only hosts require workloadSecurity.enabled" }}{{ end -}}
{{- $launch := .Values.workloadLaunch -}}
{{- $origin := required "workloadLaunch.apiUrl requires an HTTPS CP origin; external Docker controller/engine and per-slot enrollment are prerequisites" $launch.apiUrl -}}
{{- $url := urlParse $origin -}}
{{- if or (ne $url.scheme "https") (empty $url.host) $url.userinfo $url.query $url.fragment (and (ne $url.path "") (ne $url.path "/")) -}}
{{- fail "workloadLaunch.apiUrl must be an HTTPS origin without credentials, query, fragment or API path" -}}
{{- end -}}
{{- $digest := required "workloadLaunch.agentImage.digest requires an actual validated attune-workload-host-v1 image; current published agent defaults do not implement this contract" $launch.agentImage.digest -}}
{{- if eq $digest "sha256:24346320bee236e86e256a34f666359bf8c6c2a2db1c8c63c89060788e98ed4f" -}}
{{- fail "the current published agent pin does not implement attune-workload-host-v1; no legacy workload-host fallback is supported" -}}
{{- end -}}
{{- $agentImage := include "attune.image" (dict "root" . "image" $launch.agentImage) -}}
{{- $secrets := dict -}}{{- $claims := dict -}}{{- $names := dict -}}
{{- range $group := $groups -}}
{{- range $pool := $group.items -}}
{{- $component := printf "%s-%s" $group.prefix ($pool.name | lower | replace "_" "-") | trunc 63 | trimSuffix "-" -}}
{{- $name := printf "%s-%s" (include "attune.fullname" $) $component | trunc 63 | trimSuffix "-" -}}
{{- if hasKey $names $name }}{{ fail "execution host slot resource names must be unique after normalization/truncation" }}{{ end -}}
{{- $_ := set $names $name true -}}
{{- $replicas := 1 -}}{{- if hasKey $pool "replicas" }}{{ $replicas = int $pool.replicas }}{{ end -}}
{{- if ne $replicas 1 }}{{ fail "each execution host slot requires replicas: 1 and a unique enrollment; add separate slots for capacity" }}{{ end -}}
{{- range $removed := list "runtimes" "passthroughEnv" "maxDatabaseConnections" "notifierWsUrl" "allowInsecureNotifierWs" "podSecurityContext" "containerSecurityContext" -}}
{{- if hasKey $pool $removed }}{{ fail (printf "execution-only host field %s is unsupported; CP profiles select runtime/placement/authority" $removed) }}{{ end -}}
{{- end -}}
{{- $enrollment := $pool.enrollmentSecret | default dict -}}
{{- $secret := required "each execution host slot requires enrollmentSecret.name provisioned by CP" $enrollment.name -}}
{{- if hasKey $secrets $secret }}{{ fail "each execution host slot requires a unique enrollment Secret" }}{{ end -}}
{{- $_ := set $secrets $secret true -}}
{{- $custody := $pool.custody | default dict -}}
{{- $claim := $custody.existingClaim | default (printf "%s-custody" $name | trunc 63 | trimSuffix "-") -}}
{{- if hasKey $claims $claim }}{{ fail "each execution host slot requires a unique custody PVC" }}{{ end -}}
{{- $_ := set $claims $claim true -}}
{{- $grace := int ($pool.stopGracePeriod | default 120) -}}
{{- if lt $grace 120 }}{{ fail "execution host shutdown requires at least 120 seconds to withdraw/join and release encrypted custody" }}{{ end -}}
{{- range $entry := $pool.env -}}
{{- if or (not (has $entry.name (list "RUST_BACKTRACE" "SSL_CERT_DIR" "OTEL_EXPORTER_OTLP_ENDPOINT" "OTEL_SERVICE_NAME"))) (hasKey $entry "valueFrom") -}}
{{- fail "execution host env accepts only literal public observability/certificate settings; authority comes from scoped enrollment" -}}
{{- end -}}{{- end -}}
{{- if not $custody.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim | quote }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "attune.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $custody.storageClassName }}
  storageClassName: {{ $custody.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $custody.size | default "1Gi" | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "attune.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
spec:
  replicas: {{ ternary 0 1 (eq (include "attune.postgresqlMajorCutover" $) "true") }}
  strategy:
    type: Recreate
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      {{- include "attune.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component | quote }}
  template:
    metadata:
      labels:
        {{- include "attune.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component | quote }}
      annotations:
        attune.dev/release-revision: {{ $.Release.Revision | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $pool.runtimeClassName }}
      runtimeClassName: {{ $pool.runtimeClassName | quote }}
      {{- end }}
      {{- if $pool.nodeSelector }}
      nodeSelector:
        {{- toYaml $pool.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $pool.tolerations }}
      tolerations:
        {{- toYaml $pool.tolerations | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $grace }}
      initContainers:
        - name: init-agent
          image: {{ $agentImage | quote }}
          imagePullPolicy: {{ $launch.agentImage.pullPolicy | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf 'attune-workload-host-v1\n' > /opt/attune/agent/expected-contract
              for binary in attune-agent attune-sensor-agent; do
                if ! env -i PATH=/usr/local/bin:/usr/bin:/bin "/usr/local/bin/$binary" --workload-host-contract > /opt/attune/agent/observed-contract; then
                  echo 'agent image lacks execution-only workload-host contract' >&2; exit 1
                fi
                cmp -s /opt/attune/agent/expected-contract /opt/attune/agent/observed-contract || { echo 'incompatible workload-host contract' >&2; exit 1; }
                cp "/usr/local/bin/$binary" "/opt/attune/agent/$binary"
              done
              cp /etc/ssl/certs/ca-certificates.crt /opt/attune/agent/ca-certificates.crt
              test -s /opt/attune/agent/ca-certificates.crt
              chmod 0555 /opt/attune/agent/attune-agent /opt/attune/agent/attune-sensor-agent
              chmod 0444 /opt/attune/agent/ca-certificates.crt
              rm /opt/attune/agent/expected-contract /opt/attune/agent/observed-contract
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/attune/agent
      containers:
        - name: {{ $group.role }}
          image: {{ $pool.image | quote }}
          imagePullPolicy: {{ $pool.imagePullPolicy | default "IfNotPresent" | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: [{{ printf "/opt/attune/agent/%s" $group.binary | quote }}]
          env:
            - name: ATTUNE_API_URL
              value: {{ $origin | quote }}
            - name: ATTUNE_WORKLOAD_ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ $enrollment.key | default "token" | quote }}
            - name: ATTUNE_WORKLOAD_CUSTODY_DIR
              value: /var/lib/attune/custody/host
            - name: SSL_CERT_FILE
              value: /opt/attune/agent/ca-certificates.crt
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: RUST_LOG
              value: {{ $pool.logLevel | default "info" | quote }}
            {{- with $pool.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml ($pool.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/attune/agent
              readOnly: true
            - name: custody
              mountPath: /var/lib/attune/custody
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: agent-bin
          emptyDir: {}
        - name: custody
          persistentVolumeClaim:
            claimName: {{ $claim | quote }}
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
{{ end -}}
{{ end -}}
{{ end -}}
