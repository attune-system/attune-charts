{{- range .Values.actionWorkers }}
{{- $poolName := .name | lower | replace "_" "-" -}}
{{- $component := printf "action-worker-%s" $poolName | trunc 63 | trimSuffix "-" -}}
{{- $resourceName := printf "%s-%s" (include "attune.fullname" $) $component | trunc 63 | trimSuffix "-" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName | quote }}
  labels:
    {{- include "attune.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component | quote }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "attune.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component | quote }}
  template:
    metadata:
      labels:
        {{- include "attune.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component | quote }}
      annotations:
        attune.dev/release-revision: {{ $.Release.Revision | quote }}
    spec:
      {{- include "attune.workerPodSecurityContext" (dict "root" $ "worker" .) | nindent 6 }}
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .runtimeClassName }}
      runtimeClassName: {{ .runtimeClassName | quote }}
      {{- end }}
      {{- if .nodeSelector }}
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .tolerations }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}
      {{- end }}
      {{- if .stopGracePeriod }}
      terminationGracePeriodSeconds: {{ .stopGracePeriod }}
      {{- else }}
      terminationGracePeriodSeconds: 45
      {{- end }}
      initContainers:
        - name: init-agent
          image: {{ include "attune.image" (dict "root" $ "image" $.Values.images.agent) | quote }}
          imagePullPolicy: {{ $.Values.images.agent.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" $ "identity" "helper") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /usr/local/bin/attune-agent /opt/attune/agent/attune-agent
              cp /usr/local/bin/attune-sensor-agent /opt/attune/agent/attune-sensor-agent
              for optional_binary in attune-mcp attune; do
                if [ -x "/usr/local/bin/${optional_binary}" ]; then
                  cp "/usr/local/bin/${optional_binary}" "/opt/attune/agent/${optional_binary}"
                fi
              done
              chmod +x /opt/attune/agent/attune-agent /opt/attune/agent/attune-sensor-agent /opt/attune/agent/attune-mcp /opt/attune/agent/attune 2>/dev/null || true
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/attune/agent
        - name: wait-for-schema
          image: postgres:16-alpine
          {{- include "attune.containerSecurityContext" (dict "root" $ "identity" "postgres") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT to_regclass('${DB_SCHEMA}.identity')" | grep -q identity; do
                echo "waiting for schema";
                sleep 2;
              done
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" $ | quote }}
        {{- include "attune.waitForCorePack" $ | nindent 8 }}
        {{- if and $.Values.rabbitmq.enabled $.Values.rabbitmq.provisioning.enabled }}
        {{- include "attune.waitForRabbitmqCredentials" $ | nindent 8 }}
        {{- else }}
        {{- include "attune.waitForRabbitmqPort" $ | nindent 8 }}
        {{- end }}
      containers:
        - name: worker
          image: {{ .image | quote }}
          imagePullPolicy: {{ .imagePullPolicy | default "IfNotPresent" | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" $ "identity" "worker" "override" (.containerSecurityContext | default dict)) | nindent 10 }}
          command: ["/opt/attune/agent/attune-agent"]
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" $ | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ $.Values.database.schema | quote }}
            - name: ATTUNE__DATABASE__MAX_CONNECTIONS
              value: {{ .maxDatabaseConnections | default 5 | quote }}
            - name: ATTUNE_WORKER_TYPE
              value: container
            - name: ATTUNE_WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.apiServiceName" $) $.Values.api.service.port | quote }}
            - name: RUST_LOG
              value: {{ .logLevel | default "info" | quote }}
            {{- if .runtimes }}
            - name: ATTUNE_WORKER_RUNTIMES
              value: {{ join "," .runtimes | quote }}
            {{- end }}
            {{- if .env }}
            {{- toYaml .env | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml (.resources | default dict) | nindent 12 }}
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/attune/agent
              readOnly: true
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            - name: packs
              mountPath: /opt/attune/packs
              {{- if ne $.Values.storage.mode "object" }}
              readOnly: true
              {{- end }}
            - name: runtime-envs
              mountPath: /opt/attune/runtime_envs
            - name: artifacts
              mountPath: /opt/attune/artifacts
      volumes:
        - name: agent-bin
          emptyDir: {}
        - name: config
          configMap:
            name: {{ printf "%s-config" (include "attune.fullname" $) | quote }}
        - name: packs
          {{- if eq $.Values.storage.mode "object" }}
          {{- include "attune.localCacheVolume" (dict "root" $ "volume" $.Values.storage.local.packs) | nindent 10 }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" $) | quote }}
          {{- end }}
        - name: runtime-envs
          {{- if eq $.Values.storage.mode "object" }}
          {{- include "attune.localCacheVolume" (dict "root" $ "volume" $.Values.storage.local.runtimeEnvs) | nindent 10 }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-runtime-envs" (include "attune.fullname" $) | quote }}
          {{- end }}
        - name: artifacts
          {{- if eq $.Values.storage.mode "object" }}
          emptyDir:
            sizeLimit: {{ $.Values.storage.local.artifactStaging.sizeLimit | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" $) | quote }}
          {{- end }}
{{ end }}
{{ range .Values.sensorWorkers }}
{{- $poolName := .name | lower | replace "_" "-" -}}
{{- $component := printf "sensor-worker-%s" $poolName | trunc 63 | trimSuffix "-" -}}
{{- $resourceName := printf "%s-%s" (include "attune.fullname" $) $component | trunc 63 | trimSuffix "-" -}}
