{{- if .Release.IsUpgrade }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-database-preflight" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-preflight
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-60"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 180
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "database-preflight") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "attune.podSecurityContext" (dict "root" .) | nindent 6 }}
      containers:
        - name: database-preflight
          image: "postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          {{- if .Values.database.postgresql.enabled }}
          env:
            - name: DB_HOST
              value: {{ include "attune.databaseMutationHost" . | quote }}
            - name: DATABASE_FALLBACK_HOST
              value: {{ include "attune.postgresqlServiceName" . | quote }}
          {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PGCONNECT_TIMEOUT=5 PGOPTIONS='-c statement_timeout=10000 -c default_transaction_read_only=on'
              export PGHOST="$DB_HOST" PGPORT="$DB_PORT" PGUSER="$DB_USER" PGPASSWORD="$DB_PASSWORD" PGDATABASE="$DB_NAME"
              query="SELECT current_setting('server_version_num')::integer / 10000, EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'timescaledb')"
              if ! result="$(psql -X -v ON_ERROR_STOP=1 -tA -F '|' -c "$query")"; then
                if [ -z "${DATABASE_FALLBACK_HOST:-}" ] || [ "$PGHOST" = "$DATABASE_FALLBACK_HOST" ]; then
                  echo "database preflight failed; no upgrade changes applied" >&2
                  exit 1
                fi
                export PGHOST="$DATABASE_FALLBACK_HOST"
                result="$(psql -X -v ON_ERROR_STOP=1 -tA -F '|' -c "$query")"
              fi
              case "$result" in
                *'|t')
                  echo "refusing TimescaleDB database: Attune 0.8.0 requires a fresh native PostgreSQL installation; populated TimescaleDB conversion is not supported" >&2
                  exit 1
                  ;;
                *'|f') ;;
                *) echo "invalid database preflight result" >&2; exit 1 ;;
              esac
              major="${result%%|*}"
              case "$major" in ''|*[!0-9]*) echo "invalid PostgreSQL major version" >&2; exit 1 ;; esac
              [ "$major" -ge 16 ] || { echo "PostgreSQL 16 or newer is required" >&2; exit 1; }
              echo "native PostgreSQL dependency preflight passed"
{{- end }}
