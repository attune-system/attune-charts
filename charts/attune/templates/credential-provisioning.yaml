{{- if and .Values.database.postgresql.provisioning.enabled (not .Values.database.postgresql.enabled) }}
{{- fail "database.postgresql.provisioning.enabled is supported only with bundled PostgreSQL" }}
{{- end }}
{{- if and .Values.rabbitmq.provisioning.enabled (not .Values.rabbitmq.enabled) }}
{{- fail "rabbitmq.provisioning.enabled is supported only with bundled RabbitMQ" }}
{{- end }}
{{- if and .Values.database.postgresql.enabled .Values.database.postgresql.provisioning.enabled }}
{{- if not .Values.security.existingSecret }}
{{- fail "security.existingSecret is required when PostgreSQL service-account provisioning is enabled" }}
{{- end }}
{{- if not .Values.database.postgresql.admin.existingSecret }}
{{- fail "database.postgresql.admin.existingSecret is required when PostgreSQL service-account provisioning is enabled" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-provision-postgresql-%d" (include "attune.fullname" .) .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-postgresql
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.database.postgresql.provisioning.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "provision-postgresql") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision-postgresql
          image: postgres:16-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "$POSTGRES_ADMIN_USER" = "$DB_USER" ]; then
                echo "PostgreSQL administrator and service usernames must differ" >&2
                exit 1
              fi

              until PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_ADMIN_USER" \
                -d "$DB_NAME" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for PostgreSQL administrator access"
                sleep 2
              done

              PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_ADMIN_USER" \
                -d "$DB_NAME" -v ON_ERROR_STOP=1 \
                --set=service_user="$DB_USER" \
                --set=service_password="$DB_PASSWORD" \
                --set=database_name="$DB_NAME" \
                --set=schema_name="$DB_SCHEMA" <<'SQL'
              CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA public;
              CREATE EXTENSION IF NOT EXISTS pgcrypto SCHEMA public;
              CREATE EXTENSION IF NOT EXISTS timescaledb;

              SELECT format(
                'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'service_user', :'service_password'
              )
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'service_user')
              \gexec

              SELECT (
                EXISTS (
                  SELECT 1
                  FROM pg_namespace
                  WHERE nspname = :'schema_name'
                    AND nspowner <> (SELECT oid FROM pg_roles WHERE rolname = :'service_user')
                ) OR EXISTS (
                  SELECT 1
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = :'schema_name'
                    AND c.relkind IN ('r', 'p', 'S', 'v', 'm', 'f')
                    AND c.relowner <> (SELECT oid FROM pg_roles WHERE rolname = :'service_user')
                ) OR EXISTS (
                  SELECT 1
                  FROM pg_proc p
                  JOIN pg_namespace n ON n.oid = p.pronamespace
                  WHERE n.nspname = :'schema_name'
                    AND p.proowner <> (SELECT oid FROM pg_roles WHERE rolname = :'service_user')
                ) OR EXISTS (
                  SELECT 1
                  FROM pg_type t
                  JOIN pg_namespace n ON n.oid = t.typnamespace
                  WHERE n.nspname = :'schema_name'
                    AND t.typowner <> (SELECT oid FROM pg_roles WHERE rolname = :'service_user')
                )
              ) AS ownership_conflict
              \gset
              \if :ownership_conflict
                \echo 'The configured PostgreSQL service username does not own the existing Attune schema objects.'
                \echo 'Keep DB_USER stable after the first migration or transfer ownership before upgrading.'
                \quit 1
              \endif

              SELECT format(
                'ALTER ROLE %I WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'service_user'
              )
              \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'database_name', :'service_user')
              \gexec
              SELECT format(
                'CREATE SCHEMA IF NOT EXISTS %I AUTHORIZATION %I',
                :'schema_name', :'service_user'
              )
              \gexec
              SELECT format('ALTER SCHEMA %I OWNER TO %I', :'schema_name', :'service_user')
              \gexec
              SELECT format('GRANT ALL ON SCHEMA %I TO %I', :'schema_name', :'service_user')
              \gexec
              SQL
          env:
            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresqlAdminSecretName" . }}
                  key: {{ .Values.database.postgresql.admin.usernameKey }}
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresqlAdminSecretName" . }}
                  key: {{ .Values.database.postgresql.admin.passwordKey }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . }}
{{- end }}
{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.provisioning.enabled }}
{{- if not .Values.security.existingSecret }}
{{- fail "security.existingSecret is required when RabbitMQ service-account provisioning is enabled" }}
{{- end }}
{{- if not .Values.rabbitmq.admin.existingSecret }}
{{- fail "rabbitmq.admin.existingSecret is required when RabbitMQ service-account provisioning is enabled" }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-provision-rabbitmq-%d" (include "attune.fullname" .) .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: provision-rabbitmq
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.rabbitmq.provisioning.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "provision-rabbitmq") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision-rabbitmq
          image: "{{ .Values.rabbitmq.provisioning.image.repository }}:{{ .Values.rabbitmq.provisioning.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.provisioning.image.pullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import base64
              import json
              import os
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              base_url = f"http://{os.environ['RABBITMQ_HOST']}:{os.environ['RABBITMQ_MANAGEMENT_PORT']}"

              if os.environ["RABBITMQ_ADMIN_USER"] == os.environ["RABBITMQ_USER"]:
                  raise SystemExit("RabbitMQ administrator and service usernames must differ")

              def request(path, username, password, method="GET", body=None):
                  token = base64.b64encode(f"{username}:{password}".encode()).decode()
                  data = None if body is None else json.dumps(body).encode()
                  req = urllib.request.Request(
                      base_url + path,
                      data=data,
                      method=method,
                      headers={"Authorization": f"Basic {token}", "Content-Type": "application/json"},
                  )
                  with urllib.request.urlopen(req, timeout=10) as response:
                      return response.read()

              while True:
                  try:
                      request("/api/overview", os.environ["RABBITMQ_ADMIN_USER"], os.environ["RABBITMQ_ADMIN_PASSWORD"])
                      break
                  except (OSError, urllib.error.HTTPError):
                      print("waiting for RabbitMQ administrator access", flush=True)
                      time.sleep(2)

              service_user = urllib.parse.quote(os.environ["RABBITMQ_USER"], safe="")
              user_path = f"/api/users/{service_user}"
              try:
                  existing_user = json.loads(
                      request(
                          user_path,
                          os.environ["RABBITMQ_ADMIN_USER"],
                          os.environ["RABBITMQ_ADMIN_PASSWORD"],
                      )
                  )
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  request(
                      user_path,
                      os.environ["RABBITMQ_ADMIN_USER"],
                      os.environ["RABBITMQ_ADMIN_PASSWORD"],
                      method="PUT",
                      body={"password": os.environ["RABBITMQ_PASSWORD"], "tags": ""},
                  )
              else:
                  request(
                      user_path,
                      os.environ["RABBITMQ_ADMIN_USER"],
                      os.environ["RABBITMQ_ADMIN_PASSWORD"],
                      method="PUT",
                      body={"password_hash": existing_user["password_hash"], "tags": ""},
                  )
              request(
                  f"/api/permissions/%2F/{service_user}",
                  os.environ["RABBITMQ_ADMIN_USER"],
                  os.environ["RABBITMQ_ADMIN_PASSWORD"],
                  method="PUT",
                  body={"configure": ".*", "write": ".*", "read": ".*"},
              )
              request("/api/whoami", os.environ["RABBITMQ_USER"], os.environ["RABBITMQ_PASSWORD"])
          env:
            - name: RABBITMQ_HOST
              value: {{ include "attune.rabbitmqServiceName" . | quote }}
            - name: RABBITMQ_MANAGEMENT_PORT
              value: {{ .Values.rabbitmq.managementPort | quote }}
            - name: RABBITMQ_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.rabbitmqAdminSecretName" . }}
                  key: {{ .Values.rabbitmq.admin.usernameKey }}
            - name: RABBITMQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.rabbitmqAdminSecretName" . }}
                  key: {{ .Values.rabbitmq.admin.passwordKey }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . }}
{{- end }}
