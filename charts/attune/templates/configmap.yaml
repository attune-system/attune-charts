{{- if and .Values.security.oidc.enabled (empty .Values.security.oidc.discoveryUrl) }}
{{- fail "security.oidc.discoveryUrl is required when OIDC is enabled" }}
{{- end }}
{{- if and .Values.security.oidc.enabled (empty .Values.security.oidc.clientId) }}
{{- fail "security.oidc.clientId is required when OIDC is enabled" }}
{{- end }}
{{- if and .Values.security.oidc.enabled (empty .Values.security.oidc.redirectUri) }}
{{- fail "security.oidc.redirectUri is required when OIDC is enabled" }}
{{- end }}
{{- if and .Values.security.activeDirectory.enabled (empty .Values.security.activeDirectory.url) }}
{{- fail "security.activeDirectory.url is required when Active Directory is enabled" }}
{{- end }}
{{- if and .Values.security.activeDirectory.enabled (empty .Values.security.activeDirectory.bindDnTemplate) (empty .Values.security.activeDirectory.userSearchBase) }}
{{- fail "security.activeDirectory.userSearchBase is required for search-and-bind authentication" }}
{{- end }}
{{- if and .Values.security.activeDirectory.searchBindDn (empty .Values.security.identitySecret.existingSecret) }}
{{- fail "security.identitySecret.existingSecret is required when Active Directory searchBindDn is set" }}
{{- end }}
{{- if and .Values.mcp.enabled (not .Values.mcp.auth.useBootstrapTestUser) (empty .Values.mcp.auth.existingSecret) }}
{{- fail "mcp.auth.existingSecret is required when MCP does not use the bootstrap identity" }}
{{- end }}
{{- if gt (int .Values.api.executionLogStreams.perIdentityLimit) (int .Values.api.executionLogStreams.globalLimit) }}
{{- fail "api.executionLogStreams.perIdentityLimit cannot exceed globalLimit" }}
{{- end }}
{{- if le (int .Values.api.terminationGracePeriodSeconds) (int .Values.api.shutdownGracePeriodSeconds) }}
{{- fail "api.terminationGracePeriodSeconds must exceed shutdownGracePeriodSeconds" }}
{{- end }}
{{- if and (eq .Values.storage.mode "object") (empty .Values.storage.object.bucket) }}
{{- fail "storage.object.bucket is required when storage.mode is object" }}
{{- end }}
{{- if and (eq .Values.storage.mode "object") (eq .Values.storage.object.provider "s3") (empty .Values.storage.object.region) }}
{{- fail "storage.object.region is required for S3 object mode" }}
{{- end }}
{{- if and (eq .Values.storage.mode "object") (not .Values.serviceAccounts.api.create) (empty .Values.serviceAccounts.api.name) }}
{{- fail "serviceAccounts.api.name is required when object mode uses an existing API service account" }}
{{- end }}
{{- if and (eq .Values.storage.mode "object") (not .Values.serviceAccounts.supervisor.create) (empty .Values.serviceAccounts.supervisor.name) }}
{{- fail "serviceAccounts.supervisor.name is required when object mode uses an existing supervisor service account" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" (include "attune.fullname" .) | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
data:
  config.yaml: |
    security:
      login_page:
        show_local_login: {{ .Values.security.loginPage.showLocalLogin }}
        show_oidc_login: {{ .Values.security.loginPage.showOidcLogin }}
        show_ldap_login: {{ .Values.security.loginPage.showActiveDirectoryLogin }}
      oidc:
        enabled: {{ .Values.security.oidc.enabled }}
        {{- with .Values.security.oidc.discoveryUrl }}
        discovery_url: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.oidc.clientId }}
        client_id: {{ . | quote }}
        {{- end }}
        provider_name: {{ .Values.security.oidc.providerName | quote }}
        {{- with .Values.security.oidc.providerLabel }}
        provider_label: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.oidc.providerIconUrl }}
        provider_icon_url: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.oidc.redirectUri }}
        redirect_uri: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.oidc.postLogoutRedirectUri }}
        post_logout_redirect_uri: {{ . | quote }}
        {{- end }}
        scopes: {{ .Values.security.oidc.scopes | toJson }}
      ldap:
        enabled: {{ .Values.security.activeDirectory.enabled }}
        {{- with .Values.security.activeDirectory.url }}
        url: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.activeDirectory.bindDnTemplate }}
        bind_dn_template: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.activeDirectory.userSearchBase }}
        user_search_base: {{ . | quote }}
        {{- end }}
        user_filter: {{ .Values.security.activeDirectory.userFilter | quote }}
        {{- with .Values.security.activeDirectory.searchBindDn }}
        search_bind_dn: {{ . | quote }}
        {{- end }}
        login_attr: {{ .Values.security.activeDirectory.loginAttr | quote }}
        email_attr: {{ .Values.security.activeDirectory.emailAttr | quote }}
        display_name_attr: {{ .Values.security.activeDirectory.displayNameAttr | quote }}
        group_attr: {{ .Values.security.activeDirectory.groupAttr | quote }}
        starttls: {{ .Values.security.activeDirectory.startTls }}
        danger_skip_tls_verify: {{ .Values.security.activeDirectory.dangerSkipTlsVerify }}
        provider_name: {{ .Values.security.activeDirectory.providerName | quote }}
        {{- with .Values.security.activeDirectory.providerLabel }}
        provider_label: {{ . | quote }}
        {{- end }}
        {{- with .Values.security.activeDirectory.providerIconUrl }}
        provider_icon_url: {{ . | quote }}
        {{- end }}
    pack_registry:
      enabled: true
      allow_unverified_direct_remote_installs: {{ .Values.packRegistry.allowUnverifiedDirectRemoteInstalls }}
      approved_public_hosts:
{{ toYaml .Values.packRegistry.approvedPublicHosts | indent 8 }}
    packs:
      transport: {{ ternary "api" "volume" (eq .Values.storage.mode "object") | quote }}
    artifacts:
      transport: {{ ternary "api" "volume" (eq .Values.storage.mode "object") | quote }}
      log_segment_max_bytes: {{ .Values.artifacts.logSegmentMaxBytes }}
      flush_interval_ms: {{ .Values.artifacts.flushIntervalMs }}
    storage:
      {{- if eq .Values.storage.mode "object" }}
      provider: {{ .Values.storage.object.provider | quote }}
      bucket: {{ .Values.storage.object.bucket | quote }}
      prefix: {{ .Values.storage.object.prefix | quote }}
      {{- if eq .Values.storage.object.provider "s3" }}
      region: {{ .Values.storage.object.region | quote }}
      kms_key: {{ .Values.storage.object.kmsKey | default nil | toJson }}
      {{- end }}
      endpoint: {{ .Values.storage.object.endpoint | default nil | toJson }}
      {{- else }}
      provider: filesystem
      root: /opt/attune/artifacts
      {{- end }}
    notifier:
      host: "0.0.0.0"
      port: {{ .Values.notifier.service.port }}
      max_connections: 10000
  nginx.conf: |
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location /auth/ {
            proxy_pass http://{{ include "attune.apiServiceName" . }}:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            proxy_pass http://{{ include "attune.apiServiceName" . }}:{{ .Values.api.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1h;
            proxy_read_timeout 1h;
        }

        location = /ws {
            proxy_pass http://{{ include "attune.notifierServiceName" . }}:{{ .Values.notifier.service.port }}/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location /ws/ {
            proxy_pass http://{{ include "attune.notifierServiceName" . }}:{{ .Values.notifier.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /config/runtime-config.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
