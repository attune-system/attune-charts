{{- if ne .Values.database.postgresql.majorUpgradeStage "cutover" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-migrations" (include "attune.fullname" .)) (printf "%s-migrations-%d" (include "attune.fullname" .) .Release.Revision) .Release.IsUpgrade | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.migrations.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" .) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "attune.waitForDatabaseCredentials" . | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.migrations) | quote }}
          imagePullPolicy: {{ .Values.images.migrations.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            {{- if .Values.database.postgresql.enabled }}
            - name: DB_HOST
              value: {{ include "attune.databaseMutationHost" . | quote }}
            {{- end }}
            - name: MIGRATIONS_DIR
              value: /migrations
            # The 0.5.3 index seeder passes connection URLs through PGDATABASE,
            # which libpq treats as a database name. Use its explicit DB_* path.
            - name: ATTUNE__DATABASE__URL
              value: ""
            - name: ATTUNE_STANDARD_PACK_INDEX_REF
              value: {{ .Values.packRegistry.standardIndexRef | default "b50e4e6d5003717505c7b894f14b8049de32c735" | quote }}
          resources:
            {{- toYaml .Values.jobs.migrations.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-init-user" (include "attune.fullname" .)) (printf "%s-init-user-%d" (include "attune.fullname" .) .Release.Revision) .Release.IsUpgrade | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-user
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.initUser.activeDeadlineSeconds | default 300 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.initUser.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "init-user") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" .) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: init-user
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.initUser) | quote }}
          imagePullPolicy: {{ .Values.images.initUser.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          {{- if .Values.database.postgresql.enabled }}
          env:
            - name: DB_HOST
              value: {{ include "attune.databaseMutationHost" . | quote }}
            - name: ATTUNE__DATABASE__URL
              value: ""
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.jobs.initUser.activeDeadlineSeconds }} ))
              export PGCONNECT_TIMEOUT=5
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT to_regclass('${DB_SCHEMA}.identity')" | grep -q identity; do
                [ "$(date +%s)" -lt "$deadline" ] || { echo "database schema timed out after {{ .Values.jobs.initUser.activeDeadlineSeconds }}s"; exit 1; }
                echo "waiting for database schema";
                sleep 2;
              done
              exec /init-user.sh
          resources:
            {{- toYaml .Values.jobs.initUser.resources | nindent 12 }}
---
{{- $initPacksBlocking := or (not .Release.IsUpgrade) .Values.corePack.requiredOnUpgrade }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-init-packs" (include "attune.fullname" .)) (printf "%s-init-packs-%d" (include "attune.fullname" .) .Release.Revision) $initPacksBlocking | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-packs
  {{- if $initPacksBlocking }}
  annotations:
    helm.sh/hook: {{ if .Release.IsUpgrade }}post-upgrade{{ else }}post-install{{ end }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.initPacks.activeDeadlineSeconds | default 300 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.initPacks.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "init-packs") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" . "useLocalStorage" true) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: init-packs
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.initPacks) | quote }}
          imagePullPolicy: {{ .Values.images.initPacks.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "helper") | nindent 10 }}
          env:
            - name: ATTUNE_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "attune.secretName" .) .Values.corePack.deploymentTokenSecret | quote }}
                  key: {{ .Values.corePack.deploymentTokenKey | quote }}
            - name: ATTUNE_BOOTSTRAP_MODE
              value: api
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.revisionApiServiceName" .) .Values.api.service.port | quote }}
            - name: ATTUNE_CORE_PACK_VERSION
              value: {{ required "corePack.version is required" .Values.corePack.version | quote }}
            - name: ATTUNE_BOOTSTRAP_TIMEOUT_SECONDS
              value: {{ min 300 (int .Values.jobs.initPacks.activeDeadlineSeconds) | quote }}
            {{- if .Values.corePack.digest }}
            - name: ATTUNE_CORE_PACK_DIGEST
              value: {{ .Values.corePack.digest | quote }}
            {{- end }}
          command: ["python3", "/bootstrap/bootstrap-admission.py"]
          args:
            - publish
          volumeMounts:
            - name: bootstrap-admission
              mountPath: /bootstrap
              readOnly: true
            - name: pack-staging
              mountPath: /tmp
          resources:
            {{- toYaml .Values.jobs.initPacks.resources | nindent 12 }}
      volumes:
        - name: bootstrap-admission
          configMap:
            name: {{ printf "%s-bootstrap-admission" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
        - name: pack-staging
          emptyDir:
            sizeLimit: {{ .Values.storage.local.packs.sizeLimit | quote }}
{{- if $initPacksBlocking }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-content-ready" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: content-ready
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.initPacks.activeDeadlineSeconds | default 300 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.initPacks.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "content-ready") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" .) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: content-ready
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.initPacks) | quote }}
          imagePullPolicy: {{ .Values.images.initPacks.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "helper") | nindent 10 }}
          command: ["python3", "/bootstrap/bootstrap-admission.py"]
          args: ["wait"]
          env:
            - name: ATTUNE_CORE_PACK_VERSION
              value: {{ required "corePack.version is required" .Values.corePack.version | quote }}
            {{- if .Values.corePack.digest }}
            - name: ATTUNE_CORE_PACK_DIGEST
              value: {{ .Values.corePack.digest | quote }}
            {{- end }}
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.revisionApiServiceName" .) .Values.api.service.port | quote }}
            - name: ATTUNE_BOOTSTRAP_TIMEOUT_SECONDS
              value: {{ min 300 (int .Values.jobs.initPacks.activeDeadlineSeconds) | quote }}
          volumeMounts:
            - name: bootstrap-admission
              mountPath: /bootstrap
              readOnly: true
          resources:
            {{- toYaml .Values.jobs.initPacks.resources | nindent 12 }}
      volumes:
        - name: bootstrap-admission
          configMap:
            name: {{ printf "%s-bootstrap-admission" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
{{- end }}
{{- if eq (include "attune.storageCutoverRequired" .) "true" }}
{{- if not .Values.storage.object.migrateFromSharedVolume }}
{{- fail "legacy Attune PVCs were found during a sharedVolume-to-object upgrade; set storage.object.migrateFromSharedVolume=true only after stopping writes and backing up the database and PVCs" }}
{{- end }}
{{- $packs := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-packs" (include "attune.fullname" .)) }}
{{- $artifacts := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-artifacts" (include "attune.fullname" .)) }}
{{- if not (and $packs $artifacts) }}
{{- fail "sharedVolume-to-object migration requires both the legacy packs and artifacts PVCs; restore the missing claim before retrying" }}
{{- end }}
{{- if .Values.serviceAccounts.api.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attune.storageMigrationApiServiceAccountName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration-api
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccounts.api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.serviceAccounts.supervisor.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attune.storageMigrationSupervisorServiceAccountName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration-supervisor
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccounts.supervisor.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-storage-migration-config" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
{{- $renderedConfigMap := include (print $.Template.BasePath "/configmap.yaml") . | fromYaml }}
{{ get (get $renderedConfigMap "data") "config.yaml" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-upgrade-pack-releases" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-pack-releases
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-8"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.storageMigration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.jobs.storageMigration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "upgrade-pack-releases") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" . "useLocalStorage" true) | nindent 6 }}
      serviceAccountName: {{ include "attune.storageMigrationApiServiceAccountName" . | quote }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: upgrade-pack-releases
          # Storage metadata only, not proof of runtime admission. Never invoke
          # the legacy release freezer or create/activate releases here.
          image: {{ printf "%s:%s" .Values.database.postgresql.image.repository .Values.database.postgresql.image.tag | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export PGPASSWORD="$DB_PASSWORD" PGCONNECT_TIMEOUT=5
              if ! psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -v schema="$DB_SCHEMA" -At <<'SQL' | grep -qx t
              BEGIN READ ONLY;
              SET search_path TO :"schema", public;
              SELECT NOT EXISTS (
                SELECT 1 FROM pack p
                LEFT JOIN pack_release pr ON pr.id = p.active_release AND pr.pack = p.id
                WHERE pr.id IS NULL
                  OR (pr.object_key IS NULL AND pr.archive_path IS NULL)
              );
              COMMIT;
              SQL
              then
                echo 'storage cutover requires an immutable active release with an object reference or legacy archive for every pack; no release was frozen or activated' >&2
                exit 1
              fi
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            {{- if .Values.database.postgresql.enabled }}
            - name: DB_HOST
              value: {{ include "attune.databaseMutationHost" . | quote }}
            - name: ATTUNE__DATABASE__URL
              value: ""
            {{- end }}
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: ATTUNE__DATABASE__MAX_CONNECTIONS
              value: {{ .Values.jobs.storageMigration.maxDatabaseConnections | quote }}
          resources:
            {{- toYaml .Values.jobs.storageMigration.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-storage" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-storage
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-7"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.storageMigration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.jobs.storageMigration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "migrate-storage") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "attune.podSecurityContext" (dict "root" . "useLocalStorage" true) | nindent 6 }}
      serviceAccountName: {{ include "attune.storageMigrationSupervisorServiceAccountName" . | quote }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-storage
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.supervisor) | quote }}
          imagePullPolicy: {{ .Values.images.supervisor.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "attune") | nindent 10 }}
          command: ["/usr/local/bin/attune-service"]
          args: ["migrate-storage"]
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            {{- if .Values.database.postgresql.enabled }}
            - name: DB_HOST
              value: {{ include "attune.databaseMutationHost" . | quote }}
            - name: ATTUNE__DATABASE__URL
              value: ""
            {{- end }}
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: ATTUNE__DATABASE__MAX_CONNECTIONS
              value: {{ .Values.jobs.storageMigration.maxDatabaseConnections | quote }}
          volumeMounts:
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            - name: legacy-packs
              mountPath: /opt/attune/packs
              readOnly: false
            - name: legacy-artifacts
              mountPath: /opt/attune/artifacts
              readOnly: false
          resources:
            {{- toYaml .Values.jobs.storageMigration.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-storage-migration-config" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
        - name: legacy-packs
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
        - name: legacy-artifacts
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
{{- end }}
{{- end }}
