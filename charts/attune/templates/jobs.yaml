apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-migrations" (include "attune.fullname" .)) (printf "%s-migrations-%d" (include "attune.fullname" .) .Release.Revision) .Release.IsUpgrade | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.migrations.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "attune.waitForDatabaseCredentials" . | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.migrations) | quote }}
          imagePullPolicy: {{ .Values.images.migrations.pullPolicy | quote }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: MIGRATIONS_DIR
              value: /migrations
            # The 0.5.3 index seeder passes connection URLs through PGDATABASE,
            # which libpq treats as a database name. Use its explicit DB_* path.
            - name: ATTUNE__DATABASE__URL
              value: ""
            - name: ATTUNE_STANDARD_PACK_INDEX_REF
              value: {{ .Values.packRegistry.standardIndexRef | default "b50e4e6d5003717505c7b894f14b8049de32c735" | quote }}
          resources:
            {{- toYaml .Values.jobs.migrations.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-init-user" (include "attune.fullname" .)) (printf "%s-init-user-%d" (include "attune.fullname" .) .Release.Revision) .Release.IsUpgrade | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-user
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.initUser.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.initUser.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "init-user") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: init-user
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.initUser) | quote }}
          imagePullPolicy: {{ .Values.images.initUser.pullPolicy | quote }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT to_regclass('${DB_SCHEMA}.identity')" | grep -q identity; do
                echo "waiting for database schema";
                sleep 2;
              done
              exec /init-user.sh
          resources:
            {{- toYaml .Values.jobs.initUser.resources | nindent 12 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ ternary (printf "%s-init-packs" (include "attune.fullname" .)) (printf "%s-init-packs-%d" (include "attune.fullname" .) .Release.Revision) .Release.IsUpgrade | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-packs
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: {{ ternary "post-upgrade" "pre-upgrade" (eq .Values.storage.mode "object") }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  activeDeadlineSeconds: {{ .Values.jobs.initPacks.activeDeadlineSeconds | default 600 }}
  ttlSecondsAfterFinished: {{ .Values.jobs.initPacks.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "init-packs") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- if eq .Values.storage.mode "object" }}
      {{- include "attune.localStoragePodSecurityContext" . | nindent 6 }}
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: init-packs
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.initPacks) | quote }}
          imagePullPolicy: {{ .Values.images.initPacks.pullPolicy | quote }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          {{- if eq .Values.storage.mode "object" }}
          env:
            - name: ATTUNE_BOOTSTRAP_MODE
              value: api
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.revisionApiServiceName" .) .Values.api.service.port | quote }}
          {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- if eq .Values.storage.mode "object" }}
              until python3 - <<'PY'
              import os
              import urllib.request

              with urllib.request.urlopen(
                  f"{os.environ['ATTUNE_API_URL']}/health/ready", timeout=5
              ) as response:
                  raise SystemExit(0 if 200 <= response.status < 300 else 1)
              PY
              do
                echo "waiting for api";
                sleep 2;
              done
              exec /init-packs.sh
              {{- else }}
              until python3 - <<'PY'
              import os
              import psycopg2

              conn = psycopg2.connect(
                  host=os.environ["DB_HOST"],
                  port=os.environ["DB_PORT"],
                  user=os.environ["DB_USER"],
                  password=os.environ["DB_PASSWORD"],
                  dbname=os.environ["DB_NAME"],
              )
              try:
                  with conn.cursor() as cur:
                      cur.execute("SET search_path TO %s, public" % os.environ["DB_SCHEMA"])
                      cur.execute("SELECT to_regclass(%s)", (f"{os.environ['DB_SCHEMA']}.identity",))
                      if not cur.fetchone()[0]:
                          raise SystemExit(1)
                      cur.execute(
                          "SELECT EXISTS (SELECT 1 FROM identity WHERE login = %s)",
                          (os.environ["DEFAULT_ADMIN_LOGIN"],),
                      )
                      raise SystemExit(0 if cur.fetchone()[0] else 1)
              finally:
                  conn.close()
              PY
              do
                echo "waiting for database schema";
                sleep 2;
              done
              exec /init-packs.sh
              {{- end }}
          {{- if eq .Values.storage.mode "sharedVolume" }}
          volumeMounts:
            - name: packs
              mountPath: /opt/attune/packs
            - name: runtime-envs
              mountPath: /opt/attune/runtime_envs
            - name: artifacts
              mountPath: /opt/attune/artifacts
          {{- else }}
          volumeMounts:
            - name: pack-staging
              mountPath: /tmp
          {{- end }}
          resources:
            {{- toYaml .Values.jobs.initPacks.resources | nindent 12 }}
      volumes:
        {{- if eq .Values.storage.mode "sharedVolume" }}
        - name: packs
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
        - name: runtime-envs
          persistentVolumeClaim:
            claimName: {{ printf "%s-runtime-envs" (include "attune.fullname" .) | quote }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
        {{- else }}
        - name: pack-staging
          emptyDir:
            sizeLimit: {{ .Values.storage.local.packs.sizeLimit | quote }}
        {{- end }}
{{- if eq (include "attune.storageCutoverRequired" .) "true" }}
{{- if not .Values.storage.object.migrateFromSharedVolume }}
{{- fail "legacy Attune PVCs were found during a sharedVolume-to-object upgrade; set storage.object.migrateFromSharedVolume=true only after stopping writes and backing up the database and PVCs" }}
{{- end }}
{{- $packs := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-packs" (include "attune.fullname" .)) }}
{{- $artifacts := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-artifacts" (include "attune.fullname" .)) }}
{{- if not (and $packs $artifacts) }}
{{- fail "sharedVolume-to-object migration requires both the legacy packs and artifacts PVCs; restore the missing claim before retrying" }}
{{- end }}
{{- if .Values.serviceAccounts.api.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attune.storageMigrationApiServiceAccountName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration-api
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccounts.api.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.serviceAccounts.supervisor.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attune.storageMigrationSupervisorServiceAccountName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration-supervisor
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccounts.supervisor.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-storage-migration-config" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-migration
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
{{- $renderedConfigMap := include (print $.Template.BasePath "/configmap.yaml") . | fromYaml }}
{{ get (get $renderedConfigMap "data") "config.yaml" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-upgrade-pack-releases" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-pack-releases
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-8"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.storageMigration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.jobs.storageMigration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "upgrade-pack-releases") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "attune.storageMigrationApiServiceAccountName" . | quote }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: upgrade-pack-releases
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy | quote }}
          command: ["attune-api"]
          args: ["--upgrade-pack-releases"]
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
          volumeMounts:
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            - name: legacy-packs
              mountPath: /opt/attune/packs
              readOnly: false
            - name: legacy-artifacts
              mountPath: /opt/attune/artifacts
              readOnly: false
          resources:
            {{- toYaml .Values.jobs.storageMigration.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-storage-migration-config" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
        - name: legacy-packs
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
        - name: legacy-artifacts
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-storage" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-storage
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-7"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.jobs.storageMigration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.jobs.storageMigration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "migrate-storage") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "attune.storageMigrationSupervisorServiceAccountName" . | quote }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-storage
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.supervisor) | quote }}
          imagePullPolicy: {{ .Values.images.supervisor.pullPolicy | quote }}
          command: ["attune-supervisor"]
          args: ["migrate-storage"]
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
          volumeMounts:
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            - name: legacy-packs
              mountPath: /opt/attune/packs
              readOnly: false
            - name: legacy-artifacts
              mountPath: /opt/attune/artifacts
              readOnly: false
          resources:
            {{- toYaml .Values.jobs.storageMigration.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-storage-migration-config" (include "attune.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
        - name: legacy-packs
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
        - name: legacy-artifacts
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
{{- end }}
