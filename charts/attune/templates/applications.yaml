apiVersion: v1
kind: Service
metadata:
  name: {{ include "attune.apiServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type | quote }}
  selector:
    {{- include "attune.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if eq .Values.storage.mode "object" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "attune.revisionApiServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-revision
spec:
  type: ClusterIP
  selector:
    {{- include "attune.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
    attune.dev/release-revision: {{ .Release.Revision | quote }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attune.apiServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
        attune.dev/release-revision: {{ .Release.Revision | quote }}
      annotations:
        attune.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- include "attune.podSecurityContext" (dict "root" . "useLocalStorage" (eq .Values.storage.mode "object")) | nindent 6 }}
      {{- if eq .Values.storage.mode "object" }}
      serviceAccountName: {{ include "attune.apiServiceAccountName" . | quote }}
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT to_regclass('${DB_SCHEMA}.identity')" | grep -q identity; do
                echo "waiting for schema";
                sleep 2;
              done
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
        {{- if eq .Values.storage.mode "sharedVolume" }}
        - name: wait-for-packs
          image: busybox:1.36
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "helper") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until [ -f /opt/attune/packs/.attune-bootstrap-r{{ .Release.Revision }} ]; do
                echo "waiting for current pack bootstrap";
                sleep 2;
              done
          volumeMounts:
            - name: packs
              mountPath: /opt/attune/packs
        {{- end }}
        {{- if and .Values.rabbitmq.enabled .Values.rabbitmq.provisioning.enabled }}
        {{- include "attune.waitForRabbitmqCredentials" . | nindent 8 }}
        {{- else }}
        {{- include "attune.waitForRabbitmqPort" . | nindent 8 }}
        {{- end }}
      containers:
        - name: api
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.api) | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "attune") | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
            {{- if .Values.security.identitySecret.existingSecret }}
            - secretRef:
                name: {{ include "attune.identitySecretName" . | quote }}
            {{- end }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: ATTUNE__DATABASE__MAX_CONNECTIONS
              value: {{ .Values.api.maxDatabaseConnections | quote }}
            - name: ATTUNE__SERVER__EXECUTION_LOG_STREAM_GLOBAL_LIMIT
              value: {{ .Values.api.executionLogStreams.globalLimit | quote }}
            - name: ATTUNE__SERVER__EXECUTION_LOG_STREAM_PER_IDENTITY_LIMIT
              value: {{ .Values.api.executionLogStreams.perIdentityLimit | quote }}
            - name: ATTUNE__SERVER__EXECUTION_LOG_STREAM_LEASE_SECONDS
              value: {{ .Values.api.executionLogStreams.leaseSeconds | quote }}
            - name: ATTUNE__SERVER__EXECUTION_LOG_STREAM_HEARTBEAT_SECONDS
              value: {{ .Values.api.executionLogStreams.heartbeatSeconds | quote }}
            - name: ATTUNE__SERVER__SHUTDOWN_GRACE_PERIOD
              value: {{ .Values.api.shutdownGracePeriodSeconds | quote }}
            - name: ATTUNE__WORKER__WORKER_TYPE
              value: container
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            - name: packs
              mountPath: /opt/attune/packs
            {{- if eq .Values.storage.mode "sharedVolume" }}
            - name: runtime-envs
              mountPath: /opt/attune/runtime_envs
            {{- end }}
            - name: artifacts
              mountPath: /opt/attune/artifacts
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-config" (include "attune.fullname" .) | quote }}
        - name: packs
          {{- if eq .Values.storage.mode "object" }}
          emptyDir:
            sizeLimit: {{ .Values.storage.local.packs.sizeLimit | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
          {{- end }}
        {{- if eq .Values.storage.mode "sharedVolume" }}
        - name: runtime-envs
          persistentVolumeClaim:
            claimName: {{ printf "%s-runtime-envs" (include "attune.fullname" .) | quote }}
        {{- end }}
        - name: artifacts
          {{- if eq .Values.storage.mode "object" }}
          emptyDir:
            sizeLimit: {{ .Values.storage.local.artifactStaging.sizeLimit | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
          {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-executor" (include "attune.fullname" .) | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.executor.replicaCount }}
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "executor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "executor") | nindent 8 }}
      annotations:
        attune.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      {{- include "attune.podSecurityContext" (dict "root" . "useLocalStorage" (eq .Values.storage.mode "object")) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT to_regclass('${DB_SCHEMA}.identity')" | grep -q identity; do
                echo "waiting for schema";
                sleep 2;
              done
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
        {{- if and .Values.rabbitmq.enabled .Values.rabbitmq.provisioning.enabled }}
        {{- include "attune.waitForRabbitmqCredentials" . | nindent 8 }}
        {{- end }}
        {{- include "attune.waitForCorePack" . | nindent 8 }}
      containers:
        - name: executor
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.executor) | quote }}
          imagePullPolicy: {{ .Values.images.executor.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "attune") | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "attune.secretName" . | quote }}
          env:
            - name: ATTUNE_CONFIG
              value: /opt/attune/config.yaml
            - name: ATTUNE__DATABASE__SCHEMA
              value: {{ .Values.database.schema | quote }}
            - name: ATTUNE__DATABASE__MAX_CONNECTIONS
              value: {{ .Values.executor.maxDatabaseConnections | quote }}
            - name: ATTUNE__WORKER__WORKER_TYPE
              value: container
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.apiServiceName" .) .Values.api.service.port | quote }}
          resources:
            {{- toYaml .Values.executor.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/attune/config.yaml
              subPath: config.yaml
            {{- if eq .Values.storage.mode "sharedVolume" }}
            - name: packs
              mountPath: /opt/attune/packs
            {{- end }}
            - name: artifacts
              mountPath: /opt/attune/artifacts
      volumes:
        - name: config
          configMap:
            name: {{ printf "%s-config" (include "attune.fullname" .) | quote }}
        {{- if eq .Values.storage.mode "sharedVolume" }}
        - name: packs
          persistentVolumeClaim:
            claimName: {{ printf "%s-packs" (include "attune.fullname" .) | quote }}
        {{- end }}
        - name: artifacts
          {{- if eq .Values.storage.mode "object" }}
          emptyDir:
            sizeLimit: {{ .Values.storage.local.artifactStaging.sizeLimit | quote }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-artifacts" (include "attune.fullname" .) | quote }}
          {{- end }}
---
