kind: Service
metadata:
  name: {{ include "attune.mcpServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type | quote }}
  selector:
    {{- include "attune.componentLabels" (dict "root" . "component" "mcp") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "attune.mcpServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "mcp") | nindent 8 }}
      annotations:
        attune.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      {{- include "attune.podSecurityContext" (dict "root" .) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "helper") | nindent 10 }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until wget -qO- "http://{{ include "attune.apiServiceName" . }}:{{ .Values.api.service.port }}/health" >/dev/null; do
                echo "waiting for api";
                sleep 2;
              done
      containers:
        - name: mcp
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.mcp) | quote }}
          imagePullPolicy: {{ .Values.images.mcp.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "attune") | nindent 10 }}
          command: ["/usr/local/bin/attune-mcp"]
          env:
            - name: ATTUNE_API_URL
              value: {{ printf "http://%s:%v" (include "attune.apiServiceName" .) .Values.api.service.port | quote }}
            - name: ATTUNE_MCP_TRANSPORT
              value: http
            - name: ATTUNE_MCP_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.mcp.service.port | quote }}
            {{- if .Values.mcp.auth.useBootstrapTestUser }}
            - name: ATTUNE_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.secretName" . | quote }}
                  key: "TEST_LOGIN"
            - name: ATTUNE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.secretName" . | quote }}
                  key: "TEST_PASSWORD"
            {{- else }}
            - name: ATTUNE_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.auth.existingSecret | quote }}
                  key: {{ .Values.mcp.auth.loginKey | quote }}
            - name: ATTUNE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcp.auth.existingSecret | quote }}
                  key: {{ .Values.mcp.auth.passwordKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
