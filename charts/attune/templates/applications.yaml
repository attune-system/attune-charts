apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-web" (include "attune.fullname" .) | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "web") | nindent 8 }}
      annotations:
        attune.dev/release-revision: {{ .Release.Revision | quote }}
    spec:
      {{- include "attune.podSecurityContext" (dict "root" . "override" (dict "fsGroup" .Values.workloadSecurity.identities.web.runAsGroup "fsGroupChangePolicy" "OnRootMismatch")) | nindent 6 }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "attune.image" (dict "root" . "image" .Values.images.web) | quote }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy | quote }}
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "web" "override" (dict "capabilities" (dict "add" (list "NET_BIND_SERVICE")))) | nindent 10 }}
          env:
            - name: API_URL
              value: {{ .Values.web.config.apiUrl | quote }}
            - name: WS_URL
              value: {{ .Values.web.config.wsUrl | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.web.config.environment | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/attune.conf
              subPath: nginx.conf
            {{- if .Values.workloadSecurity.enabled }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config
            {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ printf "%s-config" (include "attune.fullname" .) | quote }}
        {{- if .Values.workloadSecurity.enabled }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
        {{- end }}
{{- if .Values.mcp.enabled }}
---
