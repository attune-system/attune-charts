{{- if .Values.database.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "attune.postgresqlServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "attune.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "attune.postgresqlServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "attune.postgresqlServiceName" . | quote }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      {{- include "attune.podSecurityContext" (dict "root" . "override" (dict "fsGroup" .Values.workloadSecurity.identities.postgres.runAsGroup "fsGroupChangePolicy" "OnRootMismatch")) | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.database.postgresql.image.repository .Values.database.postgresql.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "postgres") | nindent 10 }}
          args: ["-c", {{ printf "max_connections=%d" (int .Values.database.postgresql.maxConnections) | quote }}]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresqlAdminSecretName" . | quote }}
                  key: {{ .Values.database.postgresql.admin.usernameKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresqlAdminSecretName" . | quote }}
                  key: {{ .Values.database.postgresql.admin.passwordKey | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.database.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.database.postgresql.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.database.postgresql.persistence.size | quote }}
        {{- if .Values.database.postgresql.persistence.storageClassName }}
        storageClassName: {{ .Values.database.postgresql.persistence.storageClassName | quote }}
        {{- end }}
{{- end }}
{{- if .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "attune.rabbitmqServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "attune.componentLabels" (dict "root" . "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.port }}
      targetPort: amqp
    - name: management
      port: {{ .Values.rabbitmq.managementPort }}
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "attune.rabbitmqServiceName" . | quote }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "attune.rabbitmqServiceName" . | quote }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "attune.componentLabels" (dict "root" . "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "attune.componentLabels" (dict "root" . "component" "rabbitmq") | nindent 8 }}
    spec:
      {{- include "attune.podSecurityContext" (dict "root" . "override" (dict "fsGroup" .Values.workloadSecurity.identities.rabbitmq.runAsGroup "fsGroupChangePolicy" "OnRootMismatch")) | nindent 6 }}
      containers:
        - name: rabbitmq
          image: {{ printf "%s:%s" .Values.rabbitmq.image.repository .Values.rabbitmq.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "attune.containerSecurityContext" (dict "root" . "identity" "rabbitmq") | nindent 10 }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.rabbitmqAdminSecretName" . | quote }}
                  key: {{ .Values.rabbitmq.admin.usernameKey | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.rabbitmqAdminSecretName" . | quote }}
                  key: {{ .Values.rabbitmq.admin.passwordKey | quote }}
            - name: RABBITMQ_DEFAULT_VHOST
              value: /
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.rabbitmq.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.persistence.size | quote }}
        {{- if .Values.rabbitmq.persistence.storageClassName }}
        storageClassName: {{ .Values.rabbitmq.persistence.storageClassName | quote }}
        {{- end }}
{{- end }}
