nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ghcr.io
  imageNamespace: attune-system
  imageTag: "0.6.1"
  imagePullSecrets: []

security:
  # Required. The Secret must contain the runtime keys listed in the chart README.
  existingSecret: ""
  identitySecret:
    # Optional API-only Secret for OIDC and Active Directory credentials.
    existingSecret: ""
  loginPage:
    showLocalLogin: true
    showOidcLogin: true
    showActiveDirectoryLogin: true
  oidc:
    enabled: false
    discoveryUrl: ""
    clientId: ""
    providerName: oidc
    providerLabel: SSO
    providerIconUrl: ""
    redirectUri: ""
    postLogoutRedirectUri: ""
    # Additional scopes beyond openid, email, and profile.
    scopes: []
  activeDirectory:
    # Attune connects to Active Directory through its LDAP interface.
    enabled: false
    url: ""
    # Set this for direct bind. Use {login} for the submitted username.
    bindDnTemplate: ""
    # Leave bindDnTemplate empty to use search and bind.
    userSearchBase: ""
    userFilter: "(sAMAccountName={login})"
    searchBindDn: ""
    loginAttr: sAMAccountName
    emailAttr: mail
    displayNameAttr: displayName
    groupAttr: memberOf
    startTls: false
    # Disables certificate verification. Do not enable in production.
    dangerSkipTlsVerify: false
    providerName: ad
    providerLabel: Active Directory
    providerIconUrl: ""

database:
  schema: attune
  database: attune
  host: ""
  port: 5432
  # Connections kept outside application pools for Jobs, monitoring, and operators.
  connectionReserve: 20
  postgresql:
    enabled: true
    maxConnections: 100
    admin:
      # Set an existing administrator Secret before enabling provisioning.
      # Without one, the bundled database keeps the legacy shared account.
      existingSecret: ""
      usernameKey: DB_USER
      passwordKey: DB_PASSWORD
    provisioning:
      enabled: false
      activeDeadlineSeconds: 600
    image:
      repository: timescale/timescaledb
      tag: 2.17.2-pg16
    persistence:
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      storageClassName: ""
    resources: {}

rabbitmq:
  host: ""
  port: 5672
  managementPort: 15672
  enabled: true
  admin:
    # Set an existing administrator Secret before enabling provisioning.
    # Without one, bundled RabbitMQ keeps the legacy shared account.
    existingSecret: ""
    usernameKey: RABBITMQ_USER
    passwordKey: RABBITMQ_PASSWORD
  provisioning:
    enabled: false
    activeDeadlineSeconds: 600
    image:
      repository: python
      tag: 3.12-alpine
      pullPolicy: IfNotPresent
  image:
    repository: rabbitmq
    tag: 3.13-management-alpine
  persistence:
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    storageClassName: ""
  resources: {}

packRegistry:
  # Override with another immutable 40-character commit SHA when promoting a
  # tested catalog snapshot with this release.
  standardIndexRef: b50e4e6d5003717505c7b894f14b8049de32c735
  # Hosts required by the pinned Attune Standard Pack Index. Use [] to opt out
  # of public registry and pack-source traffic by default.
  approvedPublicHosts:
    - raw.githubusercontent.com
    - github.com
    - codeload.github.com
  # Direct remote sources bypass registry-supplied checksums.
  allowUnverifiedDirectRemoteInstalls: false

artifacts:
  # Per-stream in-memory runtime-log loss window. See the chart README for
  # worker and sensor memory-request sizing.
  logSegmentMaxBytes: 65536
  flushIntervalMs: 500

storage:
  # One durable storage mode applies to the whole release.
  mode: sharedVolume
  object:
    provider: s3
    bucket: ""
    prefix: ""
    region: ""
    endpoint: ""
    kmsKey: ""
    # Set true only for the first sharedVolume-to-object upgrade. Helm refuses
    # that cutover when legacy claims exist unless this is explicitly enabled.
    migrateFromSharedVolume: false
  local:
    # Worker cache volumes use bounded emptyDir by default. Generic ephemeral
    # volumes create one dynamically provisioned RWO claim for each Pod.
    mode: emptyDir
    # fsGroup makes local writable volumes work without forcing arbitrary
    # runtime images to use a particular UID.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    packs:
      sizeLimit: 2Gi
      storageClassName: ""
    runtimeEnvs:
      sizeLimit: 10Gi
      storageClassName: ""
    artifactStaging:
      sizeLimit: 20Gi

serviceAccounts:
  api:
    create: true
    name: ""
    annotations: {}
  supervisor:
    create: true
    name: ""
    annotations: {}

sharedStorage:
  # These claims are mounted by several workloads. Use ReadWriteMany with an
  # RWX-capable StorageClass when pods can run on different nodes.
  packs:
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClassName: ""
  runtimeEnvs:
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  artifacts:
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClassName: ""

images:
  api:
    repository: attune/api
    tag: ""
    pullPolicy: IfNotPresent
  executor:
    repository: attune/executor
    tag: ""
    pullPolicy: IfNotPresent
  notifier:
    repository: attune/notifier
    tag: ""
    pullPolicy: IfNotPresent
  supervisor:
    repository: attune/supervisor
    tag: ""
    pullPolicy: IfNotPresent
  mcp:
    repository: attune/agent
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: attune/web
    tag: ""
    pullPolicy: IfNotPresent
  migrations:
    repository: attune/migrations
    tag: ""
    pullPolicy: IfNotPresent
  initUser:
    repository: attune/init-user
    tag: ""
    pullPolicy: IfNotPresent
  initPacks:
    repository: attune/init-packs
    tag: ""
    pullPolicy: IfNotPresent
  agent:
    repository: attune/agent
    tag: ""
    pullPolicy: IfNotPresent

jobs:
  migrations:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    resources: {}
  initUser:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    resources: {}
  initPacks:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    resources: {}
  storageMigration:
    activeDeadlineSeconds: 3600
    ttlSecondsAfterFinished: 300
    maxDatabaseConnections: 5
    resources: {}

api:
  replicaCount: 1
  # Pool budget per API Pod. Total API connections are this value times replicaCount.
  maxDatabaseConnections: 10
  executionLogStreams:
    globalLimit: 100
    perIdentityLimit: 5
    leaseSeconds: 45
    heartbeatSeconds: 10
  shutdownGracePeriodSeconds: 25
  terminationGracePeriodSeconds: 30
  service:
    type: ClusterIP
    port: 8080
  resources: {}

executor:
  replicaCount: 1
  maxDatabaseConnections: 10
  resources: {}

supervisor:
  replicaCount: 1
  maxDatabaseConnections: 5
  resources: {}

notifier:
  replicaCount: 1
  maxDatabaseConnections: 5
  service:
    type: ClusterIP
    port: 8081
  resources: {}

mcp:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8090
  auth:
    useBootstrapTestUser: true
    # Required when useBootstrapTestUser is false.
    existingSecret: ""
    loginKey: ATTUNE_LOGIN
    passwordKey: ATTUNE_PASSWORD
  resources: {}

web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  config:
    environment: kubernetes
    # Empty URLs use same-origin /api, /auth, and /ws routes through nginx.
    apiUrl: ""
    wsUrl: ""
  resources: {}
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: attune.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Agent-based runtime pools
# These deploy the universal worker and sensor agents into operator-selected
# runtime images instead of baking dedicated Attune worker binaries into each image.
#
# Each entry creates a separate Deployment with an `init-agent` init container
# that copies the statically-linked agent binaries into an EmptyDir volume.
# The main container then executes the mounted binary from /opt/attune/agent.
#
# Supported fields per pool entry:
#   name             (required) - Unique name for this worker (used in resource names)
#   image            (required) - Container image with your desired runtime(s)
#   replicas         (optional) - Number of pod replicas (default: 1)
#   runtimes         (optional) - List of runtimes to expose; [] = auto-detect
#   resources        (optional) - Kubernetes resource requests/limits
#   env              (optional) - Kubernetes env entries; use secretKeyRef for secrets
#   imagePullPolicy  (optional) - Pull policy for the worker image
#   logLevel         (optional) - RUST_LOG level (default: "info")
#   runtimeClassName (optional) - Kubernetes RuntimeClass (e.g., "nvidia" for GPU)
#   nodeSelector     (optional) - Node selector map for pod scheduling
#   tolerations      (optional) - Tolerations list for pod scheduling
#   stopGracePeriod  (optional) - Termination grace period in seconds (default: 45)
#   maxDatabaseConnections (optional) - Database pool budget per worker Pod (default: 5)
#
# Default action workers mirror the Docker Compose agent deployment model.
actionWorkers:
  - name: full
    image: nikolaik/python-nodejs:python3.12-nodejs22-slim
    replicas: 1
    maxDatabaseConnections: 5
    runtimes: [shell, python, node, native]
    resources: {}

# Default sensor workers include at least one Python+Node.js runtime image.
sensorWorkers:
  - name: default
    image: nikolaik/python-nodejs:python3.12-nodejs22-slim
    replicas: 1
    maxDatabaseConnections: 5
    runtimes: [shell, python, node, native]
    logLevel: debug
    # The default notifier endpoint is plaintext inside the cluster network.
    allowInsecureNotifierWs: true
    resources: {}

# Example values for heterogeneous runtime pools:
#
# actionWorkers:
#   - name: python312
#     image: python:3.12-slim
#     replicas: 1
#     runtimes: [python, shell]
#   - name: python314
#     image: python:3.14-rc-slim
#     replicas: 1
#     runtimes: [python, shell]
#   - name: nodejs
#     image: node:22-slim
#     replicas: 1
#     runtimes: [node, shell]
#
# sensorWorkers:
#   - name: java
#     image: eclipse-temurin:21-jre
#     replicas: 1
#     runtimes: [java, shell]
#   - name: js-python
#     image: nikolaik/python-nodejs:python3.12-nodejs22-slim
#     replicas: 1
#     runtimes: [python, node, shell, native]
