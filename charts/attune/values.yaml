nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ghcr.io
  imageNamespace: attune-system
  # Stable platform release. Per-image tags or digests can override this value;
  # the init-packs image is versioned independently below.
  imageTag: "0.11.1"
  imagePullSecrets: []

# Secure workload defaults satisfy Kubernetes Pod Security Admission's
# restricted profile. Disable only on clusters that cannot support these
# contexts. Worker pools can override their runtime container identity.
workloadSecurity:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  identities:
    attune:
      runAsUser: 1000
      runAsGroup: 1000
    helper:
      runAsUser: 1000
      runAsGroup: 1000
    postgres:
      runAsUser: 70
      runAsGroup: 70
    rabbitmq:
      runAsUser: 100
      runAsGroup: 101
    web:
      runAsUser: 101
      runAsGroup: 101
    worker:
      runAsUser: 1000
      runAsGroup: 1000

security:
  # Required. The Secret must contain the runtime keys listed in the chart README.
  existingSecret: ""
  identitySecret:
    # Optional API-only Secret for OIDC and Active Directory credentials.
    existingSecret: ""
  # Optional public, plain-text notice shown before web and CLI login.
  loginDisclosure: ""
  loginPage:
    showLocalLogin: true
    showOidcLogin: true
    showActiveDirectoryLogin: true
  oidc:
    enabled: false
    discoveryUrl: ""
    clientId: ""
    providerName: oidc
    providerLabel: SSO
    providerIconUrl: ""
    redirectUri: ""
    postLogoutRedirectUri: ""
    # Additional scopes beyond openid, email, and profile.
    scopes: []
    # The groups scope also requires a verified groups claim at login.
    requireGroups: false
    deviceClient:
      # Leave empty to reuse the web registration. Okta requires a Native app.
      clientId: ""
      # Public clients need no secret. Confidential clients use client_secret_basic.
      # Store the secret in security.identitySecret, never in chart values.
  activeDirectory:
    # Attune connects to Active Directory through its LDAP interface.
    enabled: false
    url: ""
    # Set this for direct bind. Use {login} for the submitted username.
    bindDnTemplate: ""
    # Leave bindDnTemplate empty to use search and bind.
    userSearchBase: ""
    userFilter: "(sAMAccountName={login})"
    searchBindDn: ""
    loginAttr: sAMAccountName
    emailAttr: mail
    displayNameAttr: displayName
    groupAttr: memberOf
    startTls: false
    # Disables certificate verification. Do not enable in production.
    dangerSkipTlsVerify: false
    providerName: ad
    providerLabel: Active Directory
    providerIconUrl: ""

branding:
  # Optional public HTTPS URLs or absolute paths on the Attune web origin.
  logoUrl: ""
  iconUrl: ""
  faviconUrl: ""
  workflowWatermarkUrl: ""

database:
  schema: attune
  database: attune
  host: ""
  port: 5432
  # Connections kept outside application pools for Jobs, monitoring, and operators.
  connectionReserve: 20
  postgresql:
    enabled: true
    # PostgreSQL 16 cutover requires startFresh+cutover, followed by
    # refuse+complete after restoring the database into PostgreSQL 18.
    majorUpgradePolicy: refuse
    majorUpgradeStage: complete
    maxConnections: 100
    admin:
      # Set an existing administrator Secret before enabling provisioning.
      # Without one, the bundled database keeps the legacy shared account.
      existingSecret: ""
      usernameKey: DB_USER
      passwordKey: DB_PASSWORD
    provisioning:
      enabled: false
      activeDeadlineSeconds: 600
    image:
      repository: postgres
      tag: 18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    persistence:
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      storageClassName: ""
    resources: {}

rabbitmq:
  host: ""
  port: 5672
  managementPort: 15672
  enabled: true
  # Existing RabbitMQ 3 data requires an explicit migration or reset.
  majorUpgradePolicy: refuse
  admin:
    # Set an existing administrator Secret before enabling provisioning.
    # Without one, bundled RabbitMQ keeps the legacy shared account.
    existingSecret: ""
    usernameKey: RABBITMQ_USER
    passwordKey: RABBITMQ_PASSWORD
  provisioning:
    enabled: false
    activeDeadlineSeconds: 600
    image:
      repository: python
      tag: 3.12-alpine
      pullPolicy: IfNotPresent
  image:
    repository: rabbitmq
    tag: 4.3.6-management-alpine@sha256:1aab4d911053f3ee4ff9bb231f5192ebd6a12281f8044910256a667fdb04108d
  persistence:
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    storageClassName: ""
  resources: {}

packRegistry:
  # Override with another immutable 40-character commit SHA when promoting a
  # tested catalog snapshot with this release.
  standardIndexRef: b50e4e6d5003717505c7b894f14b8049de32c735
  # Hosts required by the pinned Attune Standard Pack Index. Use [] to opt out
  # of public registry and pack-source traffic by default.
  approvedPublicHosts:
    - raw.githubusercontent.com
    - github.com
    - codeload.github.com
  # Direct remote sources bypass registry-supplied checksums.
  allowUnverifiedDirectRemoteInstalls: false

artifacts:
  # Per-stream in-memory runtime-log loss window. See the chart README for
  # worker and sensor memory-request sizing.
  logSegmentMaxBytes: 65536
  flushIntervalMs: 500

storage:
  # One durable storage mode applies to the whole release.
  mode: sharedVolume
  object:
    provider: s3
    bucket: ""
    prefix: ""
    region: ""
    endpoint: ""
    kmsKey: ""
    # Set true only for the first sharedVolume-to-object upgrade. Helm refuses
    # that cutover when legacy claims exist unless this is explicitly enabled.
    migrateFromSharedVolume: false
  local:
    # Worker cache volumes use bounded emptyDir by default. Generic ephemeral
    # volumes create one dynamically provisioned RWO claim for each Pod.
    mode: emptyDir
    # fsGroup makes local writable volumes work without forcing arbitrary
    # runtime images to use a particular UID.
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    packs:
      sizeLimit: 2Gi
      storageClassName: ""
    runtimeEnvs:
      sizeLimit: 10Gi
      storageClassName: ""
    artifactStaging:
      sizeLimit: 20Gi

serviceAccounts:
  api:
    create: true
    name: ""
    annotations: {}
  supervisor:
    create: true
    name: ""
    annotations: {}

sharedStorage:
  # These claims are mounted by several workloads. Use ReadWriteMany with an
  # RWX-capable StorageClass when pods can run on different nodes.
  packs:
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClassName: ""
  runtimeEnvs:
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  artifacts:
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClassName: ""

images:
  # Published 0.11.1 platform multiarch indexes; digests take precedence over tags.
  # Platform provenance: docs/published-images-0.11.1.json. NOT corePack.digest.
  api:
    repository: attune/api
    digest: "sha256:f303cfdd4fc12a464f6e5172f538dc045cc4dd20dcc9c6d9ce94bd562901961c"
    tag: ""
    pullPolicy: IfNotPresent
  executor:
    repository: attune/executor
    digest: "sha256:9cb164659b914cb60d42e956580b0b863b4c0288bf9073e98a4957524240ee8f"
    tag: ""
    pullPolicy: IfNotPresent
  notifier:
    repository: attune/notifier
    digest: "sha256:4855e10fee7a33deca1a1cbf1feb91cc7498e94e6fd8ef7f790a7f99510554b1"
    tag: ""
    pullPolicy: IfNotPresent
  supervisor:
    repository: attune/supervisor
    digest: "sha256:8e388b6c442ad66b1d16e5f1fd1a1dbca251efed7042e7db4769469d973e759b"
    tag: ""
    pullPolicy: IfNotPresent
  mcp:
    repository: attune/agent
    digest: "sha256:24346320bee236e86e256a34f666359bf8c6c2a2db1c8c63c89060788e98ed4f"
    tag: ""
    pullPolicy: IfNotPresent
  web:
    repository: attune/web
    digest: "sha256:4966b7f9f57be74a00f1c7b924c1b657aa27ffe574ac6166d0e65cbf6e82654c"
    tag: ""
    pullPolicy: IfNotPresent
  migrations:
    repository: attune/migrations
    digest: "sha256:3230606e2148c5bf522f6797f4a49f1723218abfe8f4a16769eab5e9eb545c80"
    tag: ""
    pullPolicy: IfNotPresent
  initUser:
    repository: attune/init-user
    digest: "sha256:1267e267768a61d90c6d42424aafa852f90d0ed5ed2582d10be50967a98e3782"
    tag: ""
    pullPolicy: IfNotPresent
  initPacks:
    repository: attune/init-packs
    digest: "sha256:92b52f9db7991bac65d4abaf34e5d962262f353598e1d33e82e6d81344ca187a"
    tag: "core-1.0.8"
    pullPolicy: IfNotPresent
  # Compatible 0.11.1 agent injected into all pools; runtime image is separate.
  # See README for old-core-first rollout/drainage requirements.
  agent:
    repository: attune/agent
    digest: "sha256:24346320bee236e86e256a34f666359bf8c6c2a2db1c8c63c89060788e98ed4f"
    tag: ""
    pullPolicy: IfNotPresent

corePack:
  # Existing API deployment credential, never an identity minted by a Job.
  # Empty secret name uses security.existingSecret/the chart security secret.
  deploymentTokenSecret: ""
  deploymentTokenKey: ATTUNE_BOOTSTRAP_TOKEN
  version: "1.0.8"
  # Published 0.11.1 canonical core 1.0.8 archive, including both native arches.
  # Separate from OCI image/source-upload digests; see published provenance.
  digest: "77088ba9bc6dbaaff5dbdb450e32eddcc95b561f6d9b7a2b0bfe8b263f990010"
  # Both storage modes use API admission. Optional upgrades use a normal Job;
  # required upgrades use a post-upgrade hook after target API Pods are ready.
  requiredOnUpgrade: false

jobs:
  migrations:
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300
    resources: {}
  initUser:
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 300
    resources: {}
  initPacks:
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 300
    resources: {}
  storageMigration:
    activeDeadlineSeconds: 3600
    ttlSecondsAfterFinished: 300
    maxDatabaseConnections: 5
    resources: {}

api:
  replicaCount: 1
  # Pool budget per API Pod. Total API connections are this value times replicaCount.
  maxDatabaseConnections: 10
  executionLogStreams:
    globalLimit: 100
    perIdentityLimit: 5
    leaseSeconds: 45
    heartbeatSeconds: 10
  shutdownGracePeriodSeconds: 25
  terminationGracePeriodSeconds: 30
  service:
    type: ClusterIP
    port: 8080
  resources: {}

executor:
  replicaCount: 1
  maxDatabaseConnections: 10
  resources: {}

supervisor:
  replicaCount: 1
  maxDatabaseConnections: 5
  resources: {}

notifier:
  replicaCount: 1
  maxDatabaseConnections: 5
  service:
    type: ClusterIP
    port: 8081
  resources: {}

mcp:
  enabled: false
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8090
  http:
    # Exact Host authorities, including port when sent by the client. Empty uses
    # the MCP Service name and service.port. Overrides replace this default.
    hosts: []
    # Exact browser Origins. Empty denies all requests carrying Origin.
    origins: []
  resources: {}

web:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  config:
    environment: kubernetes
    # Empty URLs use same-origin /api, /auth, and /ws routes through nginx.
    apiUrl: ""
    wsUrl: ""
  resources: {}
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: attune.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Agent-based runtime pools
# These deploy the universal worker and sensor agents into operator-selected
# runtime images instead of baking dedicated Attune worker binaries into each image.
#
# Each entry creates a separate Deployment with an `init-agent` init container
# that copies the statically-linked agent binaries into an EmptyDir volume.
# The main container then executes the mounted binary from /opt/attune/agent.
#
# Supported fields per pool entry:
#   name             (required) - Unique name for this worker (used in resource names)
#   image            (required) - Container image with your desired runtime(s)
#   replicas         (optional) - Number of pod replicas (default: 1)
#   runtimes         (optional) - List of runtimes to expose; [] = auto-detect
#   resources        (optional) - Kubernetes resource requests/limits
#   env              (optional) - Kubernetes env entries; use secretKeyRef for secrets
#   podSecurityContext       (optional) - Overrides shared Pod security fields
#   containerSecurityContext (optional) - Overrides shared worker container fields
#   imagePullPolicy  (optional) - Pull policy for the worker image
#   logLevel         (optional) - RUST_LOG level (default: "info")
#   runtimeClassName (optional) - Kubernetes RuntimeClass (e.g., "nvidia" for GPU)
#   nodeSelector     (optional) - Node selector map for pod scheduling
#   tolerations      (optional) - Tolerations list for pod scheduling
#   stopGracePeriod  (optional) - Termination grace period in seconds (default: 45)
#   maxDatabaseConnections (optional) - Database pool budget per worker Pod (default: 5)
#   passthroughEnv   (optional) - Exact service environment names exposed to pack processes
#
# Default action workers mirror the Docker Compose agent deployment model.
actionWorkers:
  - name: full
    image: nikolaik/python-nodejs:python3.12-nodejs22-slim
    replicas: 1
    maxDatabaseConnections: 5
    runtimes: [shell, python, node, native]
    passthroughEnv: []
    podSecurityContext: {}
    containerSecurityContext: {}
    resources: {}

# Default sensor workers include at least one Python+Node.js runtime image.
sensorWorkers:
  - name: default
    image: nikolaik/python-nodejs:python3.12-nodejs22-slim
    replicas: 1
    maxDatabaseConnections: 5
    runtimes: [shell, python, node, native]
    passthroughEnv: []
    logLevel: debug
    # The default notifier endpoint is plaintext inside the cluster network.
    allowInsecureNotifierWs: true
    podSecurityContext: {}
    containerSecurityContext: {}
    resources: {}

# Example values for heterogeneous runtime pools:
#
# actionWorkers:
#   - name: python312
#     image: python:3.12-slim
#     replicas: 1
#     runtimes: [python, shell]
#   - name: python314
#     image: python:3.14-rc-slim
#     replicas: 1
#     runtimes: [python, shell]
#   - name: nodejs
#     image: node:22-slim
#     replicas: 1
#     runtimes: [node, shell]
#
# sensorWorkers:
#   - name: java
#     image: eclipse-temurin:21-jre
#     replicas: 1
#     runtimes: [java, shell]
#   - name: js-python
#     image: nikolaik/python-nodejs:python3.12-nodejs22-slim
#     replicas: 1
#     runtimes: [python, node, shell, native]

# Optional Kubernetes-bound credentials for scoped manager database operations.
managerDatabase:
  enabled: false
  apiUrl: ""
  postgresUrl: ""
  loginPrefix: ""
  adminSecret: ""
  supervisorSecret: ""
  apiDatabaseRole: ""
  caSecret: ""
  egress: null
  pools: []
