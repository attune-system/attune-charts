name: Update Attune release

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Stable Attune version, without the v prefix. Defaults to the latest release.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-attune-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      head-sha: ${{ steps.pull-request.outputs.pull-request-head-sha }}
      pr-number: ${{ steps.pull-request.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.3

      - name: Resolve stable Attune release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(gh api repos/attune-system/attune/releases/latest --jq .tag_name)"
          fi
          version="${version#v}"
          scripts/update-attune-release.py "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package charts
        if: steps.release.outputs.changed == 'true'
        run: scripts/package.sh attune

      - name: Verify charts
        if: steps.release.outputs.changed == 'true'
        run: scripts/verify.sh

      - name: Open update pull request
        if: steps.release.outputs.changed == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/attune-release
          delete-branch: true
          commit-message: Update chart for Attune ${{ steps.release.outputs.version }}
          title: Update chart for Attune ${{ steps.release.outputs.version }}
          body: |
            Pins the Attune chart to stable release `${{ steps.release.outputs.version }}`.

            The update was generated by `scripts/update-attune-release.py` and passed `scripts/verify.sh`.

  verify-update:
    needs: update
    if: needs.update.outputs.pr-number != '' && needs.update.outputs.head-sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.update.outputs.head-sha }}

  report-validation:
    needs: [update, verify-update]
    if: always() && needs.update.outputs.pr-number != '' && needs.update.outputs.head-sha != ''
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    steps:
      - name: Record validation on the tested PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.update.outputs.head-sha }}
          VALIDATION_RESULT: ${{ needs.verify-update.result }}
          CHECK_NAME: Chart validation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$VALIDATION_RESULT" in
            success) conclusion=success ;;
            failure|cancelled|skipped) conclusion=failure ;;
            *) echo "Unexpected validation result" >&2; exit 1 ;;
          esac
          jq -n \
            --arg name "$CHECK_NAME" \
            --arg head_sha "$HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg details_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, details_url: $details_url}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input -
